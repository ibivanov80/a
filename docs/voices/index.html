<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf6eb"><title>Голос Бума · Буквобум</title><style>@font-face{font-family:Nunito;src:url('../assets/nunito-regular.ttf')}@font-face{font-family:Nunito;src:url('../assets/nunito-heavy.ttf');font-weight:800 1000}*{box-sizing:border-box}body{margin:0;background:#faf6eb;color:#34313e;font:19px Nunito,system-ui;line-height:1.5}main{max-width:680px;margin:auto;padding:40px 24px}a{color:#75559b}h1{font-size:42px;line-height:1.1}section{padding:24px;border:2px solid #e4dbca;border-radius:26px;background:#fffdf7;margin:30px 0}audio{width:100%;margin-top:15px}h2{font-size:25px;margin:0 0 8px}.play{min-height:64px;padding:15px 28px;border:0;border-radius:18px;background:#e78c61;color:#fff9ed;font:900 21px Nunito,system-ui;cursor:pointer}.status{font-size:15px;min-height:24px}button:focus-visible,a:focus-visible{outline:3px solid #8a6aaa;outline-offset:4px}</style></head><body><main><a href="../">← К игре</a><h1>Это голос Бума!</h1><p>Одобренный мужской голос Denis из ElevenLabs. Тот же голос звучит во всех заданиях и подсказках игры.</p><section><h2>Давай соберём букву А</h2><p>Послушай задание из игры.</p><button class="play">▶ Послушать</button><audio controls preload="metadata" src="../audio/0-intro.m4a?v=denis-v4-learning-v1" aria-label="Задание про букву А"></audio><p class="status" role="status"></p></section></main><script>const audio=document.querySelector('audio'),button=document.querySelector('button'),status=document.querySelector('.status');button.onclick=()=>audio.paused?audio.play().catch(()=>status.textContent='Попробуй включить плеер ниже.'):audio.pause();for(const event of ['play','pause','ended'])audio.addEventListener(event,()=>{button.textContent=audio.paused?'▶ Послушать':'Ⅱ Пауза';button.setAttribute('aria-pressed',String(!audio.paused))});audio.addEventListener('error',()=>status.textContent='Не
